services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: queuelock
      POSTGRES_PASSWORD: "iQxcwsRHy82TdtyHDFYum-ctlnqamzdi"
    volumes:
      - queuelock_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "jCmQW_AHX6AYTyNsuVyC-w5USVHM4qun"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: queuelock_test
      POSTGRES_PASSWORD: "L1GBUgui_o15xzI4PSq_6Xa9eyC2Z55C"
    volumes:
      - queuelock_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "794qI_Ms7lCzmMRlqeq5FSRDd_hXgQSn"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  queuelock_data:
  queuelock_test_data:
